name: Lint & Package

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: PHP Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Check PHP syntax
        run: |
          find ops_suite -name "*.php" -exec php -l {} \;

      - name: Verify info.xml
        run: |
          cat ops_suite/appinfo/info.xml
          php -r "
            \$xml = simplexml_load_file('ops_suite/appinfo/info.xml');
            if (\$xml === false) { echo 'Invalid XML'; exit(1); }
            echo 'info.xml OK — version: ' . \$xml->version . PHP_EOL;
          "

  package:
    name: Build ZIP
    runs-on: ubuntu-latest
    needs: lint
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build release zip
        run: |
          VERSION=$(php -r "echo simplexml_load_file('ops_suite/appinfo/info.xml')->version;")
          zip -r "ops_suite-${VERSION}.zip" ops_suite/ -x "*.DS_Store" -x "*/.git/*"
          echo "Built ops_suite-${VERSION}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ops_suite-zip
          path: ops_suite-*.zip
          retention-days: 30
